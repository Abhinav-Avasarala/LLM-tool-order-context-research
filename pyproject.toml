[project]
name = "tool-context-study"
version = "0.1.0"
description = "Tool order x conversation context study: does tool-selection accuracy depend on tool position, history length, and semantic interference?"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "huggingface_hub>=0.24",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Model serving (vLLM) is installed separately, pinned to a CUDA build
# matching the host's driver -- see docs/decision_log.md. Not declared as a
# version constraint here because the right build is host-specific.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
