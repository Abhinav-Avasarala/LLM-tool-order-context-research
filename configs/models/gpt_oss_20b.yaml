# Final-paper model (brief section 7).
model_id: "openai/gpt-oss-20b"
served_model_name: "gpt-oss-20b"
serving_framework: "vllm"
vllm_version: "0.10.1.1"   # first vLLM release with GptOssForCausalLM in ModelRegistry (0.10.0 predates it);
                            # see docs/decision_log.md for why this exact patch version, not the 0.30.0 default.
torch_version: "2.7.1+cu126"   # same cu126 pin/reasoning as Qwen (configs/models/qwen3_30b_a3b_instruct_2507_fp8.yaml);
                                 # installed in a separate conda env `tool_ctx_gptoss`, not `tool_ctx`.
transformers_version: "<5.0.0,>=4.55.0"
api_format: "responses"   # NOT /v1/chat/completions -- see docs/decision_log.md: that endpoint crashes
                           # (empty-body HTTP 500) whenever gpt-oss-20b actually emits a real tool call
                           # under this vLLM version (matches open upstream issues vllm-project/vllm#23837, #22578).
                           # run_model.py's --api-format responses flag targets /v1/responses instead.
tool_call_parser: null   # not applicable/needed: vLLM auto-detects gpt-oss via hf_config.model_type == "gpt_oss"
                          # and handles harmony encode/decode (incl. tool calls) internally -- no
                          # --enable-auto-tool-choice / --tool-call-parser flags exist or are needed for it.
reasoning_effort: "low"   # brief section 7: fixed to low for this direct-selection task;
                           # passed per-request via run_model.py's --reasoning-effort low.
gpu: "1x NVIDIA L40S (CUDA_VISIBLE_DEVICES pinned to a single idle GPU on the shared host)"
max_model_len: 8192   # smoke-test scale (H0 only); revisit for H16N/H64N/H64I phases.
gpu_memory_utilization: 0.85
decoding:
  temperature: 0.0
  max_tokens: 256   # passed as max_output_tokens under api_format=responses

launch_command: >
  HF_HOME=/home/aavasar/hf_cache CUDA_VISIBLE_DEVICES=2
  python -m vllm.entrypoints.openai.api_server
  --model openai/gpt-oss-20b
  --served-model-name gpt-oss-20b
  --max-model-len 8192
  --gpu-memory-utilization 0.85
  --port 8000

run_command: >
  python -m tool_context_study.run_model
  --conditions <conditions.jsonl>
  --model gpt-oss-20b
  --api-format responses
  --reasoning-effort low
  --output <results.jsonl>
