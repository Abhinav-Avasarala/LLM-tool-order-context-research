# Top-level experiment configuration.
# Phase 1 (this file's current state): only the `bfcl` section is load-bearing.
# Later phases will fill in catalog / history / model fields as those phases
# are implemented -- do not hand-edit sizes here without updating the brief's
# frozen design (see project README "Frozen design" section).

bfcl:
  # Official sources (see brief section 4). We pull from the HF dataset
  # mirror because, unlike the gorilla GitHub repo (which has moved on to
  # v4 files as of 2026-09-26), it still hosts the exact v3 files the brief
  # names, at a revision we can pin.
  dataset_repo: "gorilla-llm/Berkeley-Function-Calling-Leaderboard"
  dataset_revision: "61fc0608cfd831fcfbbaa676ebdfef0ed963eeda"
  repo_type: "dataset"
  github_repo: "https://github.com/ShishirPatil/gorilla"
  # Files reused for development-set ingestion (brief section 4).
  files:
    - "BFCL_v3_multiple.json"
    - "possible_answer/BFCL_v3_multiple.json"
    - "BFCL_v3_live_multiple.json"
    - "possible_answer/BFCL_v3_live_multiple.json"

