# The frozen 32-tool catalog structure (brief section 2): 4 domains x 8 tools,
# each domain split into 2 groups of 4 related tools. Every `original_name`
# must exist verbatim in BFCL_v3_multiple.json or BFCL_v3_live_multiple.json.
#
# Curated by hand (with Claude's help) from the ~891 unique normalizable
# tools across those two files, deliberately dropping literal near-duplicates
# BFCL contains under different names (e.g. weather.get / weather.get_weather
# / weather.get_weather_data all do the same thing; math.gcd / math.hcf are
# the same operation). See docs/decision_log.md for the full rationale and
# the one deliberately loose fit (car_rental, grouped with property tools).
tools:
  # --- Domain: Physics Calculators ---
  - original_name: kinematics.calculate_displacement
    domain: physics_calculators
    group: kinematics
  - original_name: kinematics.calculate_final_speed
    domain: physics_calculators
    group: kinematics
  - original_name: kinematics.calculate_acceleration
    domain: physics_calculators
    group: kinematics
  - original_name: kinematics.calculate_speed_from_rest
    domain: physics_calculators
    group: kinematics
  - original_name: capacitance_calculator.calculate
    domain: physics_calculators
    group: electromagnetism
  - original_name: resistance_calculator.calculate
    domain: physics_calculators
    group: electromagnetism
  - original_name: magnetic_field.calculate
    domain: physics_calculators
    group: electromagnetism
  - original_name: electric_field.calculate
    domain: physics_calculators
    group: electromagnetism

